<!DOCTYPE html><!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delt Kalender</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .hidden { display: none !important; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input, button { padding: 10px; font-size: 16px; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; background: #f4f4f4; margin-bottom: 5px; border-radius: 4px; }

        /* Traditional Calendar Styling */
        .calendar-box {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background-color: #ffffff;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .calendar-header {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .day-header {
            font-weight: bold;
            background: #eee;
            padding: 8px 0;
            border-radius: 4px;
            font-size: 14px;
        }
        .day-cell {
            border: 1px solid #e0e0e0;
            min-height: 50px;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
            background: #fafafa;
        }
    </style>
</head>
<body>

    <!-- Log ind sektion -->
    <div id="loginSection">
        <h2>Navn</h2>
        <form id="loginForm">
            <input type="text" id="nicknameInput" placeholder="Brugernavn" required>
            <button type="submit">Det er mig</button>
        </form>
    </div>

    <!-- Hovedkalender sektion -->
    <div id="appSection" class="hidden">
        <h2>Delt Kalender (<span id="displayUser"></span>)</h2>
        
        <form id="scheduleForm">
            <input type="text" id="taskInput" placeholder="Indtast aftale eller begivenhed" required>
            <input type="date" id="dateInput" required>
            <button type="submit">Tilføj til kalender</button>
        </form>

        <!-- Traditionel Kalender Visning -->
        <div class="calendar-box">
            <div class="calendar-header" id="currentMonthYear">Månedsoversigt</div>
            <div class="calendar-grid" id="calendarGrid">
                <div class="day-header">Man</div>
                <div class="day-header">Tir</div>
                <div class="day-header">Ons</div>
                <div class="day-header">Tor</div>
                <div class="day-header">Fre</div>
                <div class="day-header">Lør</div>
                <div class="day-header">Søn</div>
                <!-- Kalenderdage indsættes her via JavaScript -->
            </div>
        </div>

        <h3>Aftaler</h3>
        <ul id="scheduleList"></ul>
    </div>

    <!-- Link til JavaScript fil -->
    <script type="module" src="FirebaseConnector.js"></script>
</body>
</html>
