<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Shared Scheduler</title>
</head>
<body>
    <h1>Our Shared Schedule & Tasks</h1>

    <!-- Form to add tasks -->
    <form id="taskForm">
        <input type="text" id="nameInput" placeholder="Your Name" required>
        <input type="text" id="taskInput" placeholder="Task description" required>
        <button type="submit">Add Task</button>
    </form>

    <h2>Live Task List:</h2>
    <ul id="taskList">
        <li>Loading tasks...</li>
    </ul>

    <!-- Firebase Scripts (using CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // FIXED: Removed the non-existent 'addFirestore' import which was crashing the script
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // IMPORTANT: Replace this placeholder config with your actual credentials from the Firebase Console!
        const firebaseConfig = {
  apiKey: "AIzaSyByr1eMl8hQoJwY-Of2XLAUPM90RzwoOPQ",
  authDomain: "bdsm-calender.firebaseapp.com",
  projectId: "bdsm-calender",
  storageBucket: "bdsm-calender.firebasestorage.app",
  messagingSenderId: "775837531192",
  appId: "1:775837531192:web:cdc8cb4db8372ab0993acd",
  measurementId: "G-G5ZTLWRDFX"
};
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('taskForm');
        const taskList = document.getElementById('taskList');

        // 1. Handle adding a new task when the form is submitted
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('nameInput').value;
            const task = document.getElementById('taskInput').value;

            try {
                await addDoc(collection(db, "schedules"), {
                    name: name,
                    task: task,
                    createdAt: new Date()
                });
                form.reset(); // Clear the form inputs
            } catch (error) {
                console.error("Error adding task: ", error);
            }
        });

        // 2. Real-time listener: Updates the page instantly whenever data changes in Firebase
        onSnapshot(collection(db, "schedules"), (snapshot) => {
            taskList.innerHTML = ""; // Clear current list
            
            if (snapshot.empty) {
                taskList.innerHTML = "<li>No tasks added yet!</li>";
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                li.innerHTML = `<strong>${data.name}</strong>: ${data.task}`;
                taskList.appendChild(li);
            });
        });
    </script>
</body>
</html>
